<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : la visite va jusqu'aux bords sur iPhone (encoche) ; le CSS garde ses marges avec env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Survolez le Golf de Gap-Bayard au scroll : 18 trous par 72 sur le plateau de Bayard, à 1 250 m d'altitude, aux portes du Parc national des Écrins. Practice, école de golf, restaurant et hébergement." />
    <meta name="theme-color" content="#22402f" />
    <!-- préproduction privée : aucune indexation (aussi l'en-tête X-Robots-Tag de vercel.json) ; à retirer à la mise en ligne.
         Pas de robots.txt « Disallow » : il empêcherait les moteurs de lire cette consigne -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Golf de Gap-Bayard — 18 trous de montagne à 1 250 m, visite immersive" />
    <meta property="og:description" content="Survolez le Golf de Gap-Bayard au scroll : 18 trous par 72 sur le plateau de Bayard, à 1 250 m d'altitude, aux portes du Parc national des Écrins. Practice, école de golf, restaurant et hébergement." />
    <!-- og:image : les réseaux sociaux exigent une URL absolue -->
    <meta property="og:image" content="https://gap-bayard.vercel.app/media/og.jpg" />
    <meta property="og:url" content="https://gap-bayard.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Golf de Gap-Bayard — 18 trous de montagne à 1 250 m, visite immersive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
